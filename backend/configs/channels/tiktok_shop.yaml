# TikTok Shop Seller Center export column mapping — status: UNVERIFIED
# Sumber: struktur umum export TikTok Shop Seller Center ID/EN (docs/formats/ belum diisi).
# WAJIB diverifikasi dengan sample asli seller. Kalau ada kolom beda → ubah file ini
# saja, JANGAN kode parser (kontrak FR-2: mapping per-channel via config, bukan hardcode).
channel: tiktok_shop
source_system: tiktok_seller_center
display_name: TikTok Shop
price_basis: list_price_before_discount
sold_at_semantics: paid           # UNVERIFIED: konfirmasi dari sample asli
voucher_level: line
skip_empty_columns: true

columns:
  order_id:
    match: "ID Pesanan|Nomor Pesanan|No\\.? Pesanan|Order ID|Order No\\.?"
    required: true
    type: id_long                 # 15-19 digit — rawan notasi ilmiah Excel (FR-7)
  product_name:
    match: "Nama Produk|Product Name"
    required: true
  variation:
    match: "Variasi|Variation"
  sku:
    match: "Nomor SKU|SKU|SKU ID|SKU Penjual"
  qty:
    match: "Jumlah|Quantity|Qty"
    type: int
    required: true
  list_price:
    match: "Harga Jual|Harga Awal|Harga Barang|Item Price|Original Price"
    type: money
  paid_price:
    match: "Harga Setelah Diskon|Harga Setelah Diskon Penjual|Total Setelah Diskon|Selling Price"
    type: money
  seller_discount:
    match: "Diskon Penjual|Voucher Penjual|Seller Discount|Seller Voucher"
    type: money
  status:
    match: "Status Pesanan|Order Status|Item Status|Status"
    map:
      "SELESAI": completed
      "PESANAN DIPROSES": in_progress
      "SIAP DIKIRIM": in_progress
      "DIKIRIM": in_progress
      "DALAM PENGIRIMAN": in_progress
      "PEMBAYARAN DITERIMA": in_progress
      "DIBATALKAN": cancelled
      "PESANAN DIBATALKAN": cancelled
      "DIKEMBALIKAN": returned
      "PENGEMBALIAN": returned
      "DANA DIKEMBALIKAN": returned
      "MENUNGGU PEMBAYARAN": unpaid
  sold_at:
    match: "Waktu Pesanan Dibuat|Waktu Pemesanan|Waktu Pembayaran|Order Time|Order Paid Time"
    type: datetime
    tz: "Asia/Jakarta"
  buyer_kabupaten:
    match: "Kota/Kabupaten|Kabupaten/Kota|Kota|City"
  buyer_province:
    match: "Provinsi|State|Province"

pii_drop:                         # diderive dulu (region), lalu kolom asli dibuang
  - "Nama Penerima|Buyer Name|Recipient"
  - "Telepon|Phone|No\\.? HP"
  - "Alamat|Address"
