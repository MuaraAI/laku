name: CI (MuaraAI Laku)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Test Suite (FastAPI)
    runs-on: ubuntu-latest
    if: github.repository == 'MuaraAI/laku'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite (145 tests)
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend:
    name: Frontend Quality & Build (Next.js 15)
    runs-on: ubuntu-latest
    if: github.repository == 'MuaraAI/laku'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js Production (Landing + Dashboard + Auth)
        run: npm run build
